name: Build and Publish

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 $GITHUB_WORKSPACE/builds/plugins.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x src/gradlew

      - name: Build Plugins
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd $GITHUB_WORKSPACE/src
          ./gradlew make makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Fix plugins.json repositoryUrl
        env:
          WS: ${{ github.workspace }}
        run: |
          python3 - <<'EOF'
          import json, os
          ws = os.environ["WS"]
          p = os.path.join(ws, "builds", "plugins.json")
          with open(p, encoding="utf-8") as fh:
              plugins = json.load(fh)
          for pl in plugins:
              pl["repositoryUrl"] = "https://github.com/${{ github.repository }}"
              pl.setdefault("language", "ar")
          with open(p, "w", encoding="utf-8") as fh:
              json.dump(plugins, fh, ensure_ascii=False, indent=2)
          print("plugins:", [x.get("name") for x in plugins])
          EOF

      # يضيف إضافة CSM (dcenhance/dcext) إلى قائمة إضافات هذا المستودع.
      # dcext ينشر ملفات مبنية فقط (بلا سورس)، فنأخذ مُدخَله الحيّ من قائمته
      # حتى يبقى التحديث (version/fileHash) صحيحًا، ونُدرج CSM وحده لا كل
      # إضافات dcext (YouTube/IPTV/مواقع ألمانية لا تخص مستودعًا عربيًا).
      # الملف نفسه يُستضاف عند dcenhance، فلا نُعيد توزيعه.
      # فشل هذه الخطوة لا يوقف النشر (continue-on-error).
      - name: Merge CSM from dcext
        continue-on-error: true
        env:
          WS: ${{ github.workspace }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          ws = os.environ["WS"]
          dst = os.path.join(ws, "builds", "plugins.json")
          src = "https://raw.githubusercontent.com/dcenhance/dcext/main/plugins.json"
          try:
              req = urllib.request.Request(src, headers={"User-Agent": "csm-merge"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  upstream = json.load(r)
          except Exception as e:
              print("dcext unreachable, skipping CSM:", e)
              raise SystemExit(0)
          csm = next((p for p in upstream if p.get("internalName") == "CSMProvider"), None)
          if not csm:
              print("CSMProvider not found upstream, skipping")
              raise SystemExit(0)
          csm["description"] = "CSM — إضافة تخصيص واجهة كلاودستريم (المصدر: dcenhance/dcext)"
          with open(dst, encoding="utf-8") as fh:
              plugins = json.load(fh)
          plugins = [p for p in plugins if p.get("internalName") != "CSMProvider"]
          plugins.append(csm)
          with open(dst, "w", encoding="utf-8") as fh:
              json.dump(plugins, fh, ensure_ascii=False, indent=2)
          print("plugins:", [x.get("name") for x in plugins])
          EOF

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "hamedhani1998@users.noreply.github.com"
          git config --local user.name "hamedhani1998"
          git add .
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit --amend -m "Build $GITHUB_SHA"
            git push --force
          fi