name: Build and Publish

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      # The builds branch is an artefact branch: nothing may live on it but the
      # published .cs3 files, plugins.json and repo.json — all of which the
      # steps below regenerate from scratch. It was originally cut from a full
      # copy of the source tree, and the workflow only ever copied artefacts
      # *in*, so 700+ stale files (the whole module tree, .kotlin compiler logs,
      # .github) sat there and were re-committed on every build. Wiping the
      # working tree first makes the branch converge on every run, and also
      # drops .cs3 files left behind by plugins that no longer exist.
      - name: Prune builds branch
        run: |
          cd $GITHUB_WORKSPACE/builds
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          echo "pruned; remaining:"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x src/gradlew

      - name: Build Plugins
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd $GITHUB_WORKSPACE/src
          ./gradlew make makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Fix plugins.json repositoryUrl
        env:
          WS: ${{ github.workspace }}
        run: |
          python3 - <<'EOF'
          import json, os
          ws = os.environ["WS"]
          p = os.path.join(ws, "builds", "plugins.json")
          with open(p, encoding="utf-8") as fh:
              plugins = json.load(fh)
          for pl in plugins:
              pl["repositoryUrl"] = "https://github.com/${{ github.repository }}"
              pl.setdefault("language", "ar")
          with open(p, "w", encoding="utf-8") as fh:
              json.dump(plugins, fh, ensure_ascii=False, indent=4)
          print("plugins:", [x.get("name") for x in plugins])
          EOF

      # Mirror of the root repo.json onto the builds branch. Same values
      # verbatim — including the refs/heads/builds/plugins.json plugin list —
      # so the repository URL users paste never changes.
      - name: Write builds/repo.json
        env:
          WS: ${{ github.workspace }}
        run: |
          python3 - <<'EOF'
          import json, os
          ws = os.environ["WS"]
          repo_data = {
              "name": "Arab Drama Videos",
              "description": "مشاهدة الافلام والمسلسلات العربية والتركية تجربة خالية من الاعلانات",
              "iconUrl": "https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/icon.png",
              "manifestVersion": 1,
              "pluginLists": [
                  "https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/builds/plugins.json"
              ],
          }
          with open(os.path.join(ws, "builds", "repo.json"), "w", encoding="utf-8") as fh:
              json.dump(repo_data, fh, ensure_ascii=False, indent=4)
          EOF

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "hamedhani1998@users.noreply.github.com"
          git config --local user.name "hamedhani1998"
          git add .
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit --amend -m "Build $GITHUB_SHA" || git commit -m "Build $GITHUB_SHA"
            git push --force
          fi
